name: Deploy Frontend

# Builds the Vue 3 (Vite) SPA and deploys it to Azure Static Web Apps.
# Requires:
#   - secret AZURE_STATIC_WEB_APPS_API_TOKEN  (SWA deployment token from the portal)
#   - repository variable VUE_APP_API_BASE_URL (Notkace API base URL — public, not a secret)
#     (kept under its original name; Vite reads it as VITE_API_BASE_URL below)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production environment file
        run: |
          cat > .env.production <<'EOF'
          VITE_API_BASE_URL=${{ vars.VUE_APP_API_BASE_URL }}
          EOF

      - name: Build project
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
